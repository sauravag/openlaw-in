# Mounted at /etc/nginx/conf.d/default.conf inside the
# `nginxinc/nginx-unprivileged` image (docker-compose.yml's `proxy`
# service) -- a `server` block only, not a full nginx.conf: the base
# image's own /etc/nginx/nginx.conf already has the pid/temp-path
# directives that make nginx work as a non-root user, and already
# `include`s every file under conf.d/. Replacing the whole nginx.conf
# instead of layering underneath conf.d/ (an earlier version of this file
# did that) loses those directives and nginx fails to start with
# "open() /run/nginx.pid failed (13: Permission denied)" -- verified by
# actually starting this exact container.
server {
  listen 8080;

  location / {
    proxy_pass http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Overwrite, never append (Task 7 review, H1 -- do not use
    # $proxy_add_x_forwarded_for, which APPENDS to whatever a client
    # already sent). This is the one line that actually makes
    # `OPENLAW_TRUSTED_PROXY_IPS` (docker-compose.yml) honest: `web`'s
    # Next.js rewrite only forwards this header unchanged if it is
    # already present (`x-forwarded-for ??= ...` in Next's own source),
    # so whatever this proxy sets here is exactly what `api` ends up
    # trusting. A client cannot forge a different value -- this line
    # replaces it with the address nginx itself actually observed.
    proxy_set_header X-Forwarded-For $remote_addr;
  }
}
