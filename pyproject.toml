[project]
name = "openlaw"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pyarrow>=18.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "qdrant-client>=1.12",
    "voyageai>=0.3",
    "httpx>=0.27",
    "neo4j>=5.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openlaw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=openlaw --cov-report=term-missing --cov-fail-under=80"
markers = [
    "integration: requires a live Neo4j container (skips cleanly if unreachable)",
]

[tool.coverage.run]
omit = ["scripts/*"]
