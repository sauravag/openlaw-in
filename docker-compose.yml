# Local development only. Every port is bound to 127.0.0.1 so these
# datastores are not reachable from the local network — the credentials
# below are development defaults and Qdrant runs without authentication.
# Production deployment must supply real secrets and its own network policy.
#
# Datastore ports MUST stay bound to 127.0.0.1 — this is a hard project
# constraint, not a default to reconsider. When the `api` service and a
# reverse proxy are added here (self-hosting, one-command deployment), set
# OPENLAW_TRUSTED_PROXY_IPS (see .env.example) to that proxy's address on
# this network — otherwise every request reaches `api` from the same
# address and per-IP rate limiting/anonymous quota collapse into one shared
# bucket for the whole deployment. `production_app()` refuses to start
# unless that is set OR OPENLAW_NO_REVERSE_PROXY=true is set instead
# (openlaw.api.deps._require_proxy_acknowledgement) — the `api` service's
# environment block must set one of the two.

services:
  qdrant:
    image: qdrant/qdrant:v1.16.3
    ports: ["127.0.0.1:6333:6333", "127.0.0.1:6334:6334"]
    volumes: ["./data/qdrant:/qdrant/storage"]

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: openlaw
      POSTGRES_PASSWORD: openlaw
      POSTGRES_DB: openlaw
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["./data/postgres:/var/lib/postgresql/data"]

  neo4j:
    image: neo4j:2026.06.0-community
    environment:
      NEO4J_AUTH: neo4j/openlawdev
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_server_memory_pagecache_size: 4G
      NEO4J_server_memory_heap_max__size: 4G
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    volumes: ["./data/neo4j:/data"]
